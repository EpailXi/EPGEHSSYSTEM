<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPG EHS System</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4}
header{background:#004080;color:#fff;padding:10px 20px;display:flex;align-items:center}
header img{height:40px;margin-right:15px}
header h1{font-size:1.5rem;margin:0}
.tabs{display:flex;flex-wrap:wrap;background:#ddd;padding:10px}
.tabs button{background:#fff;border:1px solid #ccc;margin:2px;padding:8px 16px;cursor:pointer;border-radius:4px;font-weight:bold}
.tabs button.active{background:#004080;color:#fff}
.subtabs{display:flex;margin-top:10px;padding-left:10px}
.subtabs button{background:#eee;border:1px solid #ccc;margin:2px;padding:6px 12px;cursor:pointer;border-radius:4px}
.subtabs button.active{background:#004080;color:#fff}
.content{padding:10px}
iframe{width:100%;height:500px;border:none}
.loader{display:none;text-align:center;margin:20px}
.audio-section{display:none}
.audio-section.active{display:block}
.voice-buttons{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.voice-buttons button{padding:6px 12px;border:1px solid #888;border-radius:4px;cursor:pointer;background:#f5f5f5}
.voice-buttons button.active{background:#004080;color:white}
.audio-section audio{display:block;margin-bottom:8px;height:32px}
.video-section{display:none}
</style>
</head>
<body>
<header>
<img src="https://epailxi.github.io/EPGEHSSYSTEM/EPGLogo.png" alt="EPG Logo">
<h1>EPG EHS System</h1>
</header>

<div class="tabs" role="tablist">
<button onclick="activateTab('induction')" type="button">Induction</button>
<button onclick="activateTab('inductionsystem')" type="button">Site Induction System</button>
<button onclick="activateTab('inductionguide')" type="button">Induction Guide</button>
<button onclick="activateTab('cidb')" type="button">CIDB</button>
<button onclick="activateTab('immigration')" type="button">Immigration</button>
<button onclick="activateTab('voiceover')" type="button">Voiceover</button>
<button onclick="activateTab('ehsinventory')" type="button">EHS Inventory</button>
<button onclick="activateTab('sitevisitor')" type="button">Site Visitor Safety</button>
</div>

<div class="subtabs" id="siteVisitorSubtabs" style="display:none;">
<button onclick="activateVisitorSubtab('english')" type="button">English</button>
<button onclick="activateVisitorSubtab('chinese')" type="button">Chinese</button>
</div>

<div class="voice-buttons" id="voiceButtons" style="display:none;">
<button onclick="showAudio('chinese')" type="button">Chinese</button>
<button onclick="showAudio('urdu')" type="button">Urdu</button>
</div>

<div class="content">
<div class="loader" id="loader">Loading...</div>
<iframe id="mainFrame" loading="lazy"></iframe>

<div class="audio-section" id="chinese">
<audio controls preload="none"><source src="ChineseH.mp3" type="audio/mpeg"></audio>
<p>这里是中文语音的内容...</p>
</div>

<div class="audio-section" id="urdu">
<audio controls preload="none"><source src="UrduH.mp3" type="audio/mpeg"></audio>
<p>یہ اردو زبان کی آواز کا مواد ہے...</p>
</div>

<div class="video-section" id="visitorEnglish">
<video controls preload="none" width="100%" height="500">
<source src="SiteVisitorEnglish.mp4" type="video/mp4">
</video>
</div>

<div class="video-section" id="visitorChinese">
<video controls preload="none" width="100%" height="500">
<source src="SiteVisitorInformationChinese.mp4" type="video/mp4">
</video>
</div>
</div>

<script>
let frameTimer;

function loadFrame(src){
const iframe=document.getElementById('mainFrame');
const loader=document.getElementById('loader');
clearTimeout(frameTimer);
loader.textContent='Loading...';
loader.style.display='block';
iframe.style.display='none';
// Attach the handler BEFORE setting src so a cached/instant load can't be missed.
iframe.onload=()=>{clearTimeout(frameTimer);loader.style.display='none';};
iframe.src=src;
iframe.style.display='block';
// Fallback for pages that block embedding (X-Frame-Options / CSP) and never fire load usefully.
frameTimer=setTimeout(()=>{
loader.innerHTML='This page is taking a while or cannot be embedded here. '+
'<a href="'+src+'" target="_blank" rel="noopener">Open it in a new tab</a>.';
},8000);
}

function activateTab(tab){
document.querySelectorAll('.tabs button').forEach(btn=>btn.classList.remove('active'));
const tabBtn=document.querySelector(`.tabs button[onclick*="'${tab}'"]`);
if(tabBtn)tabBtn.classList.add('active');

document.getElementById('voiceButtons').style.display='none';
document.getElementById('siteVisitorSubtabs').style.display='none';

document.querySelectorAll('audio').forEach(a=>a.pause());
document.querySelectorAll('.audio-section').forEach(s=>s.classList.remove('active'));
document.querySelectorAll('.video-section').forEach(v=>v.style.display='none');

const iframe=document.getElementById('mainFrame');
const loader=document.getElementById('loader');
clearTimeout(frameTimer);
localStorage.setItem('selectedTab',tab);

switch(tab){
case 'induction': loadFrame('https://epailxi.github.io/EPGNTPINDUCTION'); return;
case 'inductionsystem': loadFrame('https://twswzvv3ark.feishu.link/app/app_4kc3md809u3z2'); return;
case 'inductionguide': loadFrame('https://epailxi.github.io/EHS-online-site-induction/'); return;
case 'cidb': loadFrame('https://epailxi.github.io/CIDBSlipDownload'); return;
case 'immigration': loadFrame('https://eservices.imi.gov.my/myimms/FomemaStatus'); return;
case 'ehsinventory': loadFrame('https://twswzvv3ark.aiforce.cloud/app/app_4kbvtsyp9s7h8'); return;
case 'voiceover':
iframe.src='';
iframe.style.display='none';
loader.style.display='none';
document.getElementById('voiceButtons').style.display='flex';
showAudio('chinese');
return;
case 'sitevisitor':
iframe.src='';
iframe.style.display='none';
document.getElementById('siteVisitorSubtabs').style.display='flex';
activateVisitorSubtab('english');
loader.style.display='none';
return;
}
}

function showAudio(lang){
document.querySelectorAll('.voice-buttons button').forEach(btn=>btn.classList.remove('active'));
document.querySelector(`.voice-buttons button[onclick*="${lang}"]`).classList.add('active');
document.querySelectorAll('.audio-section').forEach(sec=>sec.classList.remove('active'));
document.getElementById(lang).classList.add('active');
}

function activateVisitorSubtab(lang){
document.querySelectorAll('#siteVisitorSubtabs button').forEach(btn=>btn.classList.remove('active'));
document.querySelector(`#siteVisitorSubtabs button[onclick*="${lang}"]`).classList.add('active');
document.querySelectorAll('.video-section').forEach(v=>v.style.display='none');
document.getElementById('visitor'+capitalize(lang)).style.display='block';
}

function capitalize(str){return str.charAt(0).toUpperCase()+str.slice(1);}

// Fall back to Induction if a removed tab (e.g. old PPE tabs) is still saved in localStorage.
let savedTab=localStorage.getItem('selectedTab')||'induction';
if(!document.querySelector(`.tabs button[onclick*="'${savedTab}'"]`))savedTab='induction';
activateTab(savedTab);
</script>
</body>
</html>
